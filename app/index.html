<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<title>Engine Specs</title>
<!--
  PHASE 0 PLACEHOLDER — proves the Android build installs and runs offline.
  Phase 1 replaces this with the full app shell (home, vehicle picker, settings).
  No external resources: everything must work with no internet inside the APK.
-->
<style>
:root{--bg:#111315;--card:#1c1f23;--line:#343a42;--text:#f1f2f4;--dim:#a4abb5;--or:#ff8a3d}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){--bg:#f5f6f8;--card:#fff;--line:#d9dde3;--text:#15181c;--dim:#5b6470}}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--text);font:16px/1.6 system-ui,'Noto Sans','Noto Sans Tamil','Noto Sans Sinhala',sans-serif;
  padding:calc(24px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom));display:flex;justify-content:center}
.wrap{width:100%;max-width:420px;text-align:center}
.logo{font-size:56px;margin-top:8vh}
h1{margin:6px 0 4px;font-size:24px}
p{color:var(--dim);margin:0 0 22px}
button.lang{display:flex;align-items:center;gap:12px;width:100%;min-height:60px;margin-bottom:10px;padding:0 18px;border-radius:16px;
  border:1px solid var(--line);background:var(--card);color:var(--text);font:inherit;font-size:18px;font-weight:700;cursor:pointer}
button.lang.on{border-color:var(--or);box-shadow:0 0 0 2px var(--or) inset}
.status{margin-top:20px;padding:14px;border-radius:14px;border:1px dashed var(--line);font-size:14px;color:var(--dim)}
small{display:block;margin-top:18px;color:var(--dim);font-size:12px}
</style>
</head>
<body>
<div class="wrap">
  <div class="logo">🔧</div>
  <h1 id="title">Engine Specs</h1>
  <p id="sub"></p>
  <div id="langs"></div>
  <div class="status" id="status"></div>
  <small id="ver"></small>
</div>
<script>
(function(){
  var TXT = {
    en:{sub:"Choose your language",status:"Installed correctly. The full app (vehicles, all DTC codes, settings) is coming in the next update.",ver:"Version 0.1.0 · Phase 0 test build"},
    ta:{sub:"உங்கள் மொழியை தேர்வு செய்யுங்கள்",status:"சரியாக install ஆனது. முழு app (வாகனங்கள், எல்லா DTC codes, settings) அடுத்த update-இல் வரும்.",ver:"Version 0.1.0 · கட்டம் 0 சோதனை build"},
    si:{sub:"ඔබේ භාෂාව තෝරන්න",status:"නිවැරදිව install විය. සම්පූර්ණ app එක (වාහන, සියලු DTC codes, settings) ඊළඟ update එකේ පැමිණේ.",ver:"Version 0.1.0 · අදියර 0 පරීක්ෂණ build"}
  };
  var LANGS = [["en","🇬🇧","English"],["ta","🇱🇰","தமிழ்"],["si","🇱🇰","සිංහල"]];
  var lang = "en";
  try { lang = localStorage.getItem("kb_lang") || "en"; } catch(e){}
  function render(){
    var t = TXT[lang] || TXT.en;
    document.documentElement.lang = lang;
    document.getElementById("sub").textContent = t.sub;
    document.getElementById("status").textContent = "✅ " + t.status;
    document.getElementById("ver").textContent = t.ver;
    document.getElementById("langs").innerHTML = LANGS.map(function(l){
      return '<button class="lang'+(l[0]===lang?' on':'')+'" data-l="'+l[0]+'"><span>'+l[1]+'</span>'+l[2]+'</button>';
    }).join("");
  }
  document.getElementById("langs").addEventListener("click", function(e){
    var b = e.target.closest("button"); if (!b) return;
    lang = b.getAttribute("data-l");
    try { localStorage.setItem("kb_lang", lang); } catch(e){}
    render();
  });
  render();
})();
</script>
</body>
</html>
